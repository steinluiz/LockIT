# pins: Number of pins (max: 9)
# lives: Number of fails allowed

# durability: If enabled, a lockpick loses 1 durability per failed
# attempt instead of being consumed immediately. It breaks at 0.
durability:
  enabled: true
  amount: 5

level_1:
  pins: 6
  lives: 5

level_2:
  pins: 7
  lives: 5

level_3:
  pins: 8
  lives: 5

level_4:
  pins: 8
  lives: 4

level_5:
  pins: 9
  lives: 4

