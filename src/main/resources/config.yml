# LockIT configuration

# Send plugin messages in the player's action bar instead of chat.
# Console output always stays in chat. Action bar messages omit the prefix.
action-bar: false

# Double doors (two doors side by side, same facing, hinges on the outer sides).
# true  = one lock secures both wings. Either wing opens the same lock menu and
#         shows the same lock, and both are protected by it.
# false = each wing needs its own lock.
# Single doors and trapdoors are never affected.
double-door-single-lock: true

# Master keys: put a coded key in the first anvil slot and another coded key in
# the second. The result is the first key holding the codes of both, and the
# second key is consumed. Repeat to add more codes.
master-key:
  enabled: true
  # XP levels the anvil charges for each merge (minimum 1).
  xp-cost: 5
  # Maximum number of codes one key can hold. 0 = no limit.
  max-codes: 0

# LockIT resource pack (textures for locks, keys, lockpicks and the menus).
# Sent to players when they join. Set enabled to false to play without textures.
# If you send it here, remove it from server.properties so players don't get it twice.
resource-pack:
  enabled: true
  url: "https://download.mc-packs.net/pack/633b450eb4155f5c73fd89376b3fdc857f0c847a.zip"
  sha1: "633b450eb4155f5c73fd89376b3fdc857f0c847a"
  id: "ee8bfd55-beca-4a50-9dd1-c76e0a023c5d"
  # JSON text component or "&" color codes.
  prompt: '{"text":"Our server uses a custom resource pack!","color":"gold"}'
  # true = players who decline the pack are disconnected.
  required: true

